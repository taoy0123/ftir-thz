[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ftir-thz"          # name used with pip (hyphens are fine)
version = "0.0.0"
description = "Process and analyse FTIR spectra"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
packages = ["ftir"]    # name of the folder containing __init__.py (use underscores)